<svg viewBox="0 0 992 632" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="browse-light-title browse-light-desc" id="browse-light-root">
<title id="browse-light-title">Request flow: reading messages</title>
<desc id="browse-light-desc">Sequence of a browse call: the UI posts to internal/api, which loads the cluster from internal/store, gets the admin client and calls Browse in internal/kafka; Browse lists offsets and fetches records from Kafka without a consumer group, and the API returns them to the UI as JSON.</desc>
