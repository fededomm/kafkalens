<title id="runtime-light-title">KafkaLens runtime components</title>
<desc id="runtime-light-desc">Architecture of KafkaLens: the Angular UI reaches one shared Go core through a local HTTP server in browser mode or the Wails window in desktop mode; the chi router hands API calls to internal/api, which uses internal/kafka to talk to the Kafka clusters and internal/store to keep clusters.json.</desc>
