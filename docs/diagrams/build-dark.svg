<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 40 1056 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="build-dark-title build-dark-desc" id="build-dark-root">
<title id="build-dark-title">Build and release</title>
<desc id="build-dark-desc">Build pipeline: ng build produces web/dist, which go build embeds in the browser binary and wails build in the desktop apps; on GitHub, ci.yml checks every push and pull request, and a v* tag runs desktop.yml on three operating systems, whose release job publishes the binaries as a GitHub Release.</desc>
