# Builds the Wails desktop app on native runners (macOS can only be built on macOS).
# Run it from the Actions tab to get the binaries as run artifacts, or push a
# v* tag (git tag v0.1.0 && git push origin v0.1.0) to also publish a GitHub Release.
name: desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            tags: webkit2_41
          - os: windows-latest
            platform: windows/amd64
            tags: ""
          - os: macos-latest
            platform: darwin/universal
            tags: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - if: runner.os != 'macOS'
        run: wails build -platform ${{ matrix.platform }} -tags "${{ matrix.tags }}" -trimpath -clean -skipbindings
      - name: macOS app and installer (.dmg)
        if: runner.os == 'macOS'
        run: make desktop-macos
      # one file per platform; the Linux binary goes in a tarball and the macOS app
      # in the .dmg because artifact zips drop the executable bit
      - name: Package
        shell: bash
        run: |
          mkdir dist
          case "${{ runner.os }}" in
            Linux)   tar -czf dist/kafkalens-linux-amd64.tar.gz -C build/bin kafkalens ;;
            Windows) cp build/bin/kafkalens.exe dist/kafkalens-windows-amd64.exe ;;
            macOS)   cp build/bin/KafkaLens.dmg dist/KafkaLens-macos-universal.dmg ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: kafkalens-${{ runner.os }}
          path: dist/

  # only for tags, and only when all three builds succeeded: no partial releases
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish GitHub Release
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "KafkaLens $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
