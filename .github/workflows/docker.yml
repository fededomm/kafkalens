# Publishes the browser-mode image to Docker Hub as <DOCKERHUB_USERNAME>/kafkalens (amd64 + arm64).
# A v* tag pushes 0.7.0, 0.7 and latest; a manual run from the Actions tab pushes the branch name (e.g. main).
# Setup: repo variable DOCKERHUB_USERNAME, repo secret DOCKERHUB_TOKEN (Docker Hub access token, read & write).
name: docker

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ vars.DOCKERHUB_USERNAME }}/kafkalens
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
