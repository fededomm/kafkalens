# Checks every push to main and every pull request: UI build, go vet, tests.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # the Go binary embeds web/dist, so the UI must be built before Go compiles
      - run: npm ci && npx ng build
        working-directory: web
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt"; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      # fails on vulnerabilities reachable from our code (stdlib included: bump go.mod to fix those)
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
